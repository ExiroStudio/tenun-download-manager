[workspace]
members = [
    "crates/tenun-core",
    "crates/tenun-cli",
    "crates/tenun-ui",
    "tests/test-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Rega Fahri Saputra <codingmaster.exe@gmail.com>"]

[workspace.dependencies]
# Internal crates
tenun-core = { path = "crates/tenun-core" }
tenun-test-server = { path = "tests/test-server" }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
percent-encoding = "2.3"
httpdate = "1.0"

# CLI & UX
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

# Error handling & logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization & config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"

# Cryptography & Integrity
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"

# Persistence & DB
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
libc = "0.2"

# Testing utilities
tempfile = "3.16"
proptest = { version = "1.6", default-features = false, features = ["std"] }

# UI
slint = "1.18"
slint-build = "1.18"
arboard = "3.4"
rfd = "0.15"
open = "5.3"
notify-rust = "4.11"
interprocess = "2.2"
tray-icon = "0.19"
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
